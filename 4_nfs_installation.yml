# Step 4, NFS only: autofs mounts the share(s) in roles/automount/vars/nfs.yml
# (cesnet: /srv/nfs at /nfs), then /home, /usr/local/sbin and /scratch become
# links into /nfs. The rocky user's home moves to /local_home first so ansible
# keeps working whatever happens to /home.

- hosts: 'ManagementNodes:LoginNodes:DesktopNodes'
  gather_facts: true
  roles:
  - { role: automount }
  - { role: move_homedir }

# don't move /home aside unless the share is really there
- hosts: 'ManagementNodes:LoginNodes:DesktopNodes'
  tasks:
  - include_vars: roles/automount/vars/nfs.yml

  # listing the dir triggers autofs; findmnt then fails unless NFS is really mounted
  - name: check the shares are mounted
    shell: ls {{ item }}/ >/dev/null && findmnt -t nfs4 {{ item }}
    changed_when: false
    check_mode: false
    loop: "{{ nfs_mounts | map(attribute='path') | list }}"

  # mgmt/login keep SELinux enforcing: without this sshd can't read
  # ~/.ssh/authorized_keys in the NFS homes (key logins fail)
  - name: allow home directories on NFS under SELinux
    seboolean:
      name: use_nfs_home_dirs
      state: true
      persistent: true
    become: yes
    when: ansible_selinux.status == 'enabled'

  - name: check the share has the link targets
    stat: path={{ item }}
    register: nfs_dirs
    failed_when: not nfs_dirs.stat.exists or not nfs_dirs.stat.isdir
    loop: "{{ nfs_links | map(attribute='source') | list }}"

  - name: links into the share
    include_role:
      name: link_usr_local
    vars:
      source: "{{ item.source }}"
      dest: "{{ item.dest }}"
    loop: "{{ nfs_links }}"
