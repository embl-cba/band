# Template for group_vars/all/site.yml, which holds the real site values and
# is not in git:  cp site.example.yml group_vars/all/site.yml  and edit.
# Ansible loads it automatically for every playbook and ad-hoc command.

# ansible_host of every inventory host
site_hosts:
  mgmt-0:      10.0.0.11
  login-0:     10.0.0.12
  node-1:      10.0.0.13
  node-2:      10.0.0.14
  node-3:      10.0.0.15
  node-4:      10.0.0.16
  node-5:      10.0.0.17
  node-6:      10.0.0.18
  node-7:      10.0.0.19
  node-8:      10.0.0.20
  band-portal: 10.0.0.21
  # Keycloak: new VM (Ubuntu 24.04), and the production one (Keycloak 4.5 in
  # docker, Ubuntu 20.04) until the switch-over; no playbook targets the old one
  band-auth:   10.0.0.23
  band-auth-old: 10.0.0.24

# kernel domainname on all nodes (0_base)
site_domain: "cluster.example.org"

# public name of the portal (nginx, OIDC redirect)
site_portal_hostname: "band.example.org"

# NFS server (IPv6), as "nfs-server" in files/etcHosts; band-auth copies its
# Keycloak backups to <this>:/mnt/vd_shares/backups/keycloak
site_nfs_address: "2001:db8::10"

# LDAP server, used as ldaps://<this>; its address for hosts without DNS for it
site_ldap_host: "ldap.example.org"
site_ldap_address: "10.0.0.40"
# SHA-256 fingerprint of its (self-signed) LDAPS certificate, which Keycloak trusts:
#   openssl s_client -connect <address>:636 </dev/null | openssl x509 -noout -fingerprint -sha256
site_ldap_cert_sha256: "AA:BB:..."

# Keycloak realm the portal logs in with
site_keycloak_realm_url: "https://auth.example.org/auth/realms/<realm>"

# Keycloak clients (their secrets are vaulted in roles/eosc_vd_portal/vars/main.yml)
site_oidc_client_id: "<portal client id>"
site_oidc_resource_clientid: "<resource server client id>"
site_oidc_resource_resourceid: "<portal client id>"


# reverse proxy in front of the portal (TLS, routing; see NEW_INSTANCE.md)
site_reverse_proxy: "10.0.0.30"
