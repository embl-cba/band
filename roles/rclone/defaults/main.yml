# rclone is one static binary, kept on the share (/nfs/local/bin, for tools
# that aren't containers) for all desktop nodes; the role puts it back if it's
# missing or a different version. To upgrade, set the version and the sha256
# of rclone-v<version>-linux-amd64.zip from
# https://downloads.rclone.org/v<version>/SHA256SUMS
rclone_version: "1.76.0"
rclone_zip_sha256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
rclone_bin: /nfs/local/bin/rclone
