---
# the launcher lives on the share: install it from one node only. get_url with
# a checksum replaces it when the file differs (other version or missing).
- name: "{{ nextflow_bin | dirname }}"
  file:
    path: "{{ nextflow_bin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  run_once: true
  become: yes

# in --check the directory above isn't created, and get_url fails without it
- name: "{{ nextflow_bin | dirname }} exists"
  stat:
    path: "{{ nextflow_bin | dirname }}"
  register: nextflow_dir
  run_once: true

- name: nextflow {{ nextflow_version }}
  when: not ansible_check_mode or nextflow_dir.stat.exists
  get_url:
    url: "https://github.com/nextflow-io/nextflow/releases/download/v{{ nextflow_version }}/nextflow-{{ nextflow_version }}-dist"
    dest: "{{ nextflow_bin }}"
    checksum: "sha256:{{ nextflow_sha256 }}"
    owner: root
    group: root
    mode: '0755'
  run_once: true
  become: yes

- name: nextflow on PATH
  file:
    src: "{{ nextflow_bin }}"
    dest: /usr/local/bin/nextflow
    state: link
    force: yes
  become: yes

- name: per-user Nextflow settings
  copy:
    src: nf.sh
    dest: /etc/profile.d/nf.sh
    owner: root
    group: root
    mode: '0644'
  become: yes
