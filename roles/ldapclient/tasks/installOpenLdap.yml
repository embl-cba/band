---
- name: "Install open ldap package yum"
  become: yes
  yum: name={{ item }} state=present
  with_items:
    - openldap
    - openldap-clients
    - sssd
    - sssd-common
    - sssd-client
    - nss
    - nss-tools
  when: ansible_distribution == 'Rocky'

- name: "Install open ldap package apt"
  become: yes
  action: apt pkg={{ item }} state=present
  with_items:
    - ldap-utils
    - sssd 
    - libpam-sss 
  when: ansible_distribution == 'Ubuntu'
