---
- name: CernVM signing key
  rpm_key:
    key: "{{ cvmfs_gpg_key }}"
    state: present

# dnf can't tell from a URL whether it's installed (always "changed" in --check)
- name: check the CernVM repository package
  command: rpm -q cvmfs-release
  register: cvmfs_release
  changed_when: false
  failed_when: false
  check_mode: false

- name: CernVM repository
  dnf:
    name: "{{ cvmfs_release_rpm }}"
    state: present
  register: cvmfs_repo
  when: cvmfs_release.rc != 0

# in --check the repository isn't there yet on a fresh host
- name: install cvmfs
  dnf:
    name:
      - cvmfs
      - cvmfs-config-default
    state: present
  register: cvmfs_pkgs
  when: not (ansible_check_mode and cvmfs_repo is changed)

- name: cvmfs settings
  template:
    src: default.local.j2
    dest: /etc/cvmfs/default.local
    owner: root
    group: root
    mode: '0644'
  register: cvmfs_conf

# setup writes the autofs map (/etc/auto.master.d/cvmfs.autofs) and restarts
# autofs; only needed once
- name: check cvmfs is set up
  stat:
    path: /etc/auto.master.d/cvmfs.autofs
  register: cvmfs_autofs

- name: cvmfs_config setup
  command: cvmfs_config setup
  when: not cvmfs_autofs.stat.exists

- name: reload the cvmfs settings
  command: cvmfs_config reload
  when: cvmfs_conf is changed and cvmfs_autofs.stat.exists

- name: autofs running
  service:
    name: autofs
    state: started
    enabled: yes

# mounts each repository once and checks it answers
- name: cvmfs_config probe
  command: cvmfs_config probe
  register: cvmfs_probe
  changed_when: false
  check_mode: false
  failed_when: cvmfs_probe.rc != 0 or 'Failed' in cvmfs_probe.stdout
  when: not ansible_check_mode or cvmfs_autofs.stat.exists
