---
# Keycloak (realm "eosc") for the portal, behind the reverse proxy, with
# PostgreSQL, both in docker. Public URL https://<host of site_keycloak_realm_url>/auth,
# so the issuer and the redirect URIs registered at Google and LS AAI stay the same.
keycloak_version: "26.8.1"
keycloak_postgres_image: "postgres:17.11-bookworm"
keycloak_maven_image_tag: "3.9.9-eclipse-temurin-21"

# the EOSC registration step (Create EOSC User If Unique), built from this tag;
# sha256 of GitHub's tarball of the tag
keycloak_extension_repo: https://github.com/embl-cba/band-keycloak-flow-extension
keycloak_extension_version: v2.0.1
keycloak_extension_sha256: 47dd4bca6b837abe73b7b32f809e9965b00562a3d9864fb7e8726ae38010af00

# the login theme, installed as themes/<name> (the realm's loginTheme)
keycloak_theme_repo: https://github.com/embl-cba/band-keycloak-theme
keycloak_theme_version: v1.0.0
keycloak_theme_sha256: fbdfe897e82731539d33189e2048ca0b4f032afb4b26932301f5f4526dfa163d
keycloak_theme_name: eosc-login-theme

keycloak_hostname: "{{ site_keycloak_realm_url | urlsplit('hostname') }}"
keycloak_http_relative_path: /auth
keycloak_http_port: 8080
# health/metrics; local only
keycloak_management_port: 9000

keycloak_dir: /opt/keycloak
keycloak_image: "band-keycloak:{{ keycloak_version }}"

# the LDAP server the realm's federation and the extension use
keycloak_ldap_host: "{{ site_ldap_host }}"
keycloak_ldap_address: "{{ site_ldap_address }}"
# its LDAPS certificate is fetched at deploy time and used only with this fingerprint
keycloak_ldap_cert_sha256: "{{ site_ldap_cert_sha256 }}"

# One-time import of a realm export (from the old Keycloak), on the Ansible
# host; not in git (users, keys, secrets). Run with
#   -e keycloak_import_file=/path/eosc-realm.json --tags keycloak_import
keycloak_import_file: ""
# true replaces an existing realm (the final import at the switch-over)
keycloak_import_override: false
# the adapted copy, next to the export (same private directory); deleted after the import
keycloak_import_local: "{{ keycloak_import_file | dirname }}/.realm-import-adapted.json"

# server and import share these; TLS ends at the reverse proxy
keycloak_env:
  KC_DB_URL: "jdbc:postgresql://keycloak-postgres:5432/keycloak"
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: "{{ keycloak_db_password }}"
  KC_HOSTNAME: "https://{{ keycloak_hostname }}{{ keycloak_http_relative_path }}"
  KC_HTTP_ENABLED: "true"
  KC_PROXY_HEADERS: xforwarded
  # X-Forwarded-* only from the reverse proxy, not from anyone reaching :8080
  KC_PROXY_TRUSTED_ADDRESSES: "{{ site_reverse_proxy }}"

# docker on these VMs: the subnet's IPv4 DNS servers don't
# answer, the host resolves through its IPv6 link, which containers can't use;
# and the IPv4 network has MTU 1450, smaller than docker's default 1500
keycloak_docker_dns: ["8.8.8.8", "1.1.1.1"]
keycloak_docker_mtu: "{{ ansible_default_ipv4.mtu }}"
