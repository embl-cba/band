---
# the server exports only to an IPv6 range, so mount over IPv6 (IPv4 mounts of
# the same machine are refused); its IPv6 address is "nfs-server" in files/etcHosts
nfs_server: "nfs-server"
nfs_options: "-rw,nfsvers=4,proto=tcp6,hard,nosuid,nodev,timeo=15,retrans=5"
# mount point -> export; /nfs/scratch on the share is a link to /scratch
nfs_mounts:
  - { path: /nfs, export: /mnt/vd_shares }
  - { path: /scratch, export: /scratch }
  - { path: /vd-containers, export: /vd-containers }
