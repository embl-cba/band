---
# cesnet: one autofs mount of the server's /srv/nfs over IPv4; home, scratch
# and containers below it are separate exports that the client mounts by
# itself (NFSv4 crossing). tubi mounted [nfs-server]:/mnt/vd_shares,
# /scratch and /vd-containers over IPv6 (proto=tcp6).
nfs_server: "{{ site_nfs_address }}"
nfs_options: "-rw,nfsvers=4,hard,intr,nosuid,nodev,timeo=15,retrans=5,nolock"
# mount point -> export
nfs_mounts:
  - { path: /nfs, export: /srv/nfs }
# links into the share (4_nfs_installation.yml); a real directory at dest is
# moved to <dest>_old first, an existing link is left alone
nfs_links:
  - { source: /nfs/local/sbin, dest: /usr/local/sbin }
  - { source: /nfs/home, dest: /home }
  - { source: /nfs/scratch, dest: /scratch }
