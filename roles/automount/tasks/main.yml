---
- include_vars: nfs.yml

- include_tasks: yumPackages.yml
  when: ansible_distribution == 'Rocky'

- include_tasks: aptPackages.yml
  when: ansible_distribution == 'Ubuntu'

- name: install autofs if redhat
  yum: name="autofs" state=installed
  become: yes
  when: ansible_distribution == 'Rocky'

- name: install autofs if debian
  apt: name="autofs" state=installed
  become: yes
  when: ansible_distribution == 'Ubuntu'

- name: make /nfs
  file: path="/nfs" state=directory
  become: yes

- lineinfile: dest=/etc/auto.master line="/- file:/etc/auto.eosc"
  become: yes

- name: add auto.eosc
  become: yes
  template:
    src: auto.eosc.j2
    dest: "/etc/auto.eosc"
    owner: root
    group: root
    mode: 0644
  notify: reload autofs

# no restart: /home is on these mounts; a reload picks up map changes
- name: bring up autofs
  become: yes
  service: name=autofs state=started enabled=yes
