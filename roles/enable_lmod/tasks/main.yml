---
- include_vars: "{{ ansible_os_family }}.yml"

# the extra devel repo is "powertools" on Rocky 8 and "crb" on Rocky 9
- name: enable powertools/crb
  command: dnf config-manager --set-enabled {{ 'crb' if ansible_distribution_major_version | int >= 9 else 'powertools' }}
  become: yes
  when: ansible_distribution == "Rocky"

# Lmod and lua-filesystem come from EPEL
- name: add epel
  dnf: name=epel-release state=present
  become: yes
  when: ansible_distribution == "Rocky"

- name: install lua
  yum: name={{ item }} state=installed
  with_items:
    - lua
    - lua-filesystem
    - lua-posix
  become: yes
  when: ansible_facts['os_family'] == 'RedHat'

- name: install Lmod
  yum:
    name: Lmod
    state: present
  become: yes
  when: ansible_distribution == "Rocky"

# /usr/share/lmod/lmod is a symlink to the installed version
- name: link bash
  file: src=/usr/share/lmod/lmod/init/bash dest=/etc/profile.d/lmod.sh state=link
  become: yes

- name: link csh
  file: src=/usr/share/lmod/lmod/init/cshrc dest=/etc/profile.d/lmod.csh state=link
  become: yes
