---
# Lmod from EPEL; some of its lua modules need crb (Rocky 9)
- name: check crb is enabled
  shell: dnf repolist --enabled | grep -q '^crb '
  register: crb_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: enable crb
  command: dnf config-manager --set-enabled crb
  when: crb_enabled.rc != 0

- name: add epel
  dnf: name=epel-release state=present

- name: install Lmod
  dnf: name=Lmod state=present
  register: lmod_pkg
  # in --check a fresh host has no EPEL yet
  when: not (ansible_check_mode and crb_enabled.rc != 0)

# the Lmod package sets MODULEPATH to /etc/modulefiles:/usr/share/modulefiles;
# these replace it with lmod_modulepath for every login shell
- name: module path for sh and csh
  template:
    src: "z00_lmod.{{ item }}.j2"
    dest: "/etc/profile.d/z00_lmod.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [sh, csh]

# EESSI software stack from /cvmfs (role cvmfs), only on the hosts in
# eessi_groups; its init brings its own Lmod and adds its modules after
# lmod_modulepath
- name: EESSI {{ eessi_version }}
  template:
    src: z_eessi.sh.j2
    dest: /etc/profile.d/z_eessi.sh
    owner: root
    group: root
    mode: '0644'
  when: eessi_enabled

- name: no EESSI here
  file:
    path: /etc/profile.d/z_eessi.sh
    state: absent
  when: not eessi_enabled
