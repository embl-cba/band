---
- name: Installing MySQL Debian
  apt: name={{ item  }} update_cache=yes cache_valid_time=3600 state=present
  with_items: "{{ server_packages }}"
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: Installing MySQL RedHat
  yum: name={{ item }}
  with_items: "{{server_packages}}"
  become: yes
  when: ansible_distribution == "Rocky"

# values slurmdbd checks at startup (it warns about the MariaDB defaults);
# the buffer pool is kept small because mgmt-0 has under 4 GB of RAM
- name: InnoDB settings for slurmdbd
  copy:
    dest: /etc/my.cnf.d/slurmdbd.cnf
    content: |
      [mysqld]
      innodb_buffer_pool_size={{ mysql_innodb_buffer_pool_size | default('1024M') }}
      innodb_log_file_size=64M
      innodb_lock_wait_timeout=900
    mode: 0644
  become: yes
  register: innodb_cnf
  when: ansible_distribution == "Rocky"

- name: "Starting MySQL"
  service: name={{ sqlServiceName }} state=started enabled=true
  become: yes

- name: restart MySQL for the InnoDB settings
  service: name={{ sqlServiceName }} state=restarted
  become: yes
  when: innodb_cnf is changed

- name: make sure mysql conf directory exists
  file: dest=/etc/mysql/conf.d state=directory
  become: yes

- name: "Adding root"
  become: yes
  mysql_user: name=root host="{{ item }}" password="{{ mysql_root_password }}" login_user=root login_unix_socket={{ mysql_socket }} login_password="{{ mysql_root_password }}" check_implicit_admin=yes
  with_items:
    - "{{ ansible_hostname }}"
    - 127.0.0.1
    - ::1
    - localhost

- name: "Adding user database"
  mysql_db: name={{ mysql_user_db_name }} state=present login_user=root login_unix_socket={{ mysql_socket }} login_password={{ mysql_root_password }} 

- name: Giving priviliges to user
  mysql_user: name={{ mysql_user_name }} host={{ mysql_user_host }} password={{ mysql_user_password }} login_user=root login_unix_socket={{ mysql_socket }} login_password={{ mysql_root_password }} priv={{ mysql_user_db_name }}.*:ALL state=present
  when: mysql_user_host is defined

#- debug: var=mysql_user_hosts_group

#- debug: var=hostvars

- name: Giving priviliges to use1
  mysql_user: name={{ mysql_user_name }} host={{ hostvars[item].ansible_fqdn }} password={{ mysql_user_password }} login_user=root login_unix_socket={{ mysql_socket }} login_password={{ mysql_root_password }} priv={{ mysql_user_db_name }}.*:ALL state=present
  with_items: "{{ mysql_user_hosts_group }}"
  when: mysql_user_hosts_group is defined
