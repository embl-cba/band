# 0.5.15+ is needed for OpenSSL 3 (Rocky 9); the release tarball ships a ready configure script
- name: get munge
  get_url:
    url: https://github.com/dun/munge/releases/download/munge-{{ munge_version }}/munge-{{ munge_version }}.tar.xz
    dest: /tmp/munge-{{ munge_version }}.tar.xz

- name: untar munge
  unarchive:
    src: /tmp/munge-{{ munge_version }}.tar.xz
    dest: /tmp
    remote_src: yes
    creates: /tmp/munge-{{ munge_version }}/configure

- name: build munge
  shell: ./configure --prefix={{ munge_dir }} --with-crypto-lib=openssl && make
  args:
    chdir: /tmp/munge-{{ munge_version }}
    creates: /tmp/munge-{{ munge_version }}/src/munged/munged

- name: install munge
  shell: make install
  become: yes
  args:
    chdir: /tmp/munge-{{ munge_version }}
    creates: "{{ munge_dir }}/sbin/munged"

- name: set use_systemd
  set_fact:
    use_systemd: True
  when: ansible_distribution == "Rocky"

- name: copy init script
  template: dest=/etc/init.d/munge src=munge.initd.j2 mode=755
  become: yes
  when: use_systemd is not defined

- name:  copy slurm init script if OS contains systemd
  template: dest=/etc/systemd/system/munge.service src=munge.service.j2 mode=644
  become: yes
  when: use_systemd is defined

- name: reload systemd
  shell: systemctl daemon-reload
  become: yes
  when: use_systemd is defined
