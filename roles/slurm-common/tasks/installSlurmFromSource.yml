# Built only where {{ slurm_dir }} has no slurmd yet, or with
# -e force_slurm_recompile=true. An installed Slurm is never deleted, rebuilt
# or reinstalled over by a normal run (this used to delete bin/srun and run
# make install on every run, on live nodes too).
- name: installed Slurm
  stat:
    path: "{{ slurm_dir }}/sbin/slurmd"
  register: slurm_installed

- name: build and install Slurm {{ slurm_version }}
  when: not slurm_installed.stat.exists or (force_slurm_recompile | default(false) | bool)
  block:
  - name: remove the old build and install (force_slurm_recompile)
    file:
      path: "{{ item }}"
      state: absent
    loop:
      - /tmp/slurm-{{ slurm_version }}
      - "{{ slurm_dir }}"
    become: yes
    when: force_slurm_recompile | default(false) | bool

  - name: get slurm
    get_url:
      url: https://download.schedmd.com/slurm/slurm-{{ slurm_version }}.tar.bz2
      dest: /tmp/slurm-{{ slurm_version }}.tar.bz2

  - name: untar slurm
    unarchive:
      src: /tmp/slurm-{{ slurm_version }}.tar.bz2
      dest: /tmp
      remote_src: yes
      creates: /tmp/slurm-{{ slurm_version }}/configure

  # mariadb-devel is in CRB on Rocky 9; dbus-devel + kernel-headers are needed
  # for the cgroup/v2 plugin, otherwise it is silently not built
  - name: install slurm build deps
    dnf: name=mariadb-devel,dbus-devel,kernel-headers enablerepo=crb state=present
    become: yes

  - name: build slurm
    shell: ./configure --prefix={{ slurm_dir }} --with-munge={{ munge_dir }} && make -j{{ ansible_processor_vcpus | default(2) }}
    args:
      chdir: /tmp/slurm-{{ slurm_version }}
      creates: /tmp/slurm-{{ slurm_version }}/src/srun/srun

  - name: install slurm
    shell: make install
    become: yes
    args:
      chdir: /tmp/slurm-{{ slurm_version }}
      creates: "{{ slurm_dir }}/bin/srun"
