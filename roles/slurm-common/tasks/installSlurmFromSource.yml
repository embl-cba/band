- name: remove all install
  shell: rm -rf /tmp/slurm-{{ slurm_version }}
  become: yes 
  when: force_slurm_recompile is defined

- name: remove all install
  shell: rm -rf {{ slurm_dir }}
  become: yes 
  when: force_slurm_recompile is defined

- name: get slurm
  #shell: wget --no-check-certificate https://cvl.massive.org.au/slurm-{{ slurm_version }}.tar.bz2
  shell: wget https://download.schedmd.com/slurm/slurm-{{ slurm_version }}.tar.bz2
  args:
    chdir: /tmp
    creates: /tmp/slurm-{{ slurm_version }}.tar.bz2

- name: untar slurm
  shell: tar jxf /tmp/slurm-{{ slurm_version }}.tar.bz2
  args:
    chdir: /tmp
    creates: /tmp/slurm-{{ slurm_version }}

- name: delete srun
  command: rm -f /tmp/slurm-{{ slurm_version }}/src/srun/srun
  become: yes

- name: delete srun
  command: rm -f /opt/slurm-{{ slurm_version }}/src/srun/srun
  become: yes

- name: delete srun
  command: rm -f /opt/slurm-{{ slurm_version }}/bin/srun
  become: yes

    
# mariadb-devel is in CRB on Rocky 9; dbus-devel + kernel-headers are needed
# for the cgroup/v2 plugin, otherwise it is silently not built
- name: install slurm build deps
  dnf: name=mariadb-devel,dbus-devel,kernel-headers enablerepo=crb state=present
  become: yes

- name: build slurm
  shell: ./configure --prefix={{ slurm_dir }} --with-munge={{ munge_dir }}  && make
  args:
    chdir: /tmp/slurm-{{ slurm_version }}
    creates: /tmp/slurm-{{ slurm_version }}/src/srun/srun

- name: install slurm
  shell: make install
  become: yes
  args:
    chdir: /tmp/slurm-{{ slurm_version }}
    creates: "{{ slurm_dir }}/bin/srun"

