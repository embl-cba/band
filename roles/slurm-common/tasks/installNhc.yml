# Built only where {{ nhc_dir }} has no nhc yet: an installed NHC is never
# downloaded, rebuilt or reinstalled over (also not in --check).
- name: installed NHC
  stat:
    path: "{{ nhc_dir }}/sbin/nhc"
  register: nhc_installed

- name: build and install NHC {{ nhc_version }}
  when: not nhc_installed.stat.exists
  block:
  - name: get nhc
    get_url:
      url: https://github.com/mej/nhc/releases/download/{{ nhc_version }}/lbnl-nhc-{{ nhc_version }}.tar.xz
      dest: /tmp/lbnl-nhc-{{ nhc_version }}.tar.xz

  - name: untar nhc
    unarchive:
      src: /tmp/lbnl-nhc-{{ nhc_version }}.tar.xz
      dest: /tmp
      remote_src: yes
      creates: /tmp/lbnl-nhc-{{ nhc_version }}/configure

  - name: build nhc
    shell: ./configure --prefix={{ nhc_dir }} && make
    args:
      chdir: /tmp/lbnl-nhc-{{ nhc_version }}
      creates: /tmp/lbnl-nhc-{{ nhc_version }}/nhc

  - name: install nhc
    shell: make install
    become: yes
    args:
      chdir: /tmp/lbnl-nhc-{{ nhc_version }}
      creates: "{{ nhc_dir }}/sbin/nhc"

- name: ensure sysconfig dir exists
  file: dest=/etc/sysconfig state=directory owner=root group=root mode=755
  become: yes

- name: copy nhc sysconfig script
  template: dest=/etc/sysconfig/nhc src=nhc.sysconfig.j2 mode=644
  become: yes

- name: copy cron script
  template: dest={{ nhc_dir }}/sbin/nhc_cron src=nhc_cron.j2 mode=755
  become: yes

- name: copy nhc log rotate script
  template: dest=/etc/logrotate.d/nhc src=nhclog.j2 mode=644
  become: yes

- name: check configure file
  shell: ls {{ nhc_dir }}/etc/nhc/{{ nhc_config_file }}
  ignore_errors: true
  register: generate_nhc_config_file

# - name: generate config file
#   shell: "{{ nhc_dir }}/sbin/nhc-genconf -d -c {{ nhc_dir }}/etc/nhc/{{ nhc_config_file }} CONFDIR={{ nhc_dir }}/etc/nhc"
#   become: yes
#   when: generate_nhc_config_file

- name: config file extension
  lineinfile: dest="{{ nhc_dir }}/etc/nhc/{{ nhc_config_file }}" line="{{ item }}"
  with_items:
    nhc_user_conf
  become: yes
  when: nhc_user_conf is defined and generate_nhc_config_file

- name: remove /var/run/user if it is in the conf file
  become: yes
  lineinfile:
    dest: "{{ nhc_dir }}/etc/nhc/{{ nhc_config_file }}"
    regexp: '^.*\/run\/user\/.*'
    state: absent

# on Rocky 9 the sshd listener shows up as "sshd: /usr/sbin/sshd -D [listener] ...",
# which the stock check never matches, so NHC kept marking every node bad
- name: match the Rocky 9 sshd process name
  lineinfile:
    dest: "{{ nhc_dir }}/etc/nhc/{{ nhc_config_file }}"
    regexp: '^(\s*\*\s*\|\|\s*)check_ps_service -u root -S sshd\s*$'
    line: '\1check_ps_service -u root -S -m "sshd:" sshd'
    backrefs: yes
  become: yes

- name: start cron job
  cron: name=nhc_monitor job={{ nhc_dir }}/sbin/nhc_cron user=root minute=*/5 state=present
  become: yes

