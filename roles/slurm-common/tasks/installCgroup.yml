- name: yum install cgroup  
  yum: name={{ item }} state=installed
  with_items:
    - libcgroup
  become: yes
  when: ansible_distribution == 'Rocky' and ansible_distribution_major_version | int < 9

- name: apt install cgroup 
  apt: name={{ item }} state=installed update_cache=yes
  with_items:
    - cgmanager
    - cgmanager-utils
    - libcgmanager0 
  become: yes
  when: ansible_distribution == 'Ubuntu'

- name: config cgroup.conf file
  template: dest={{ slurm_dir }}/etc/cgroup.conf src=cgroup.conf.j2 mode=644
  become: yes
