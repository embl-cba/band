---
- name: restart tomcat
  systemd:
    name: tomcat
    state: restarted
    daemon_reload: yes
  become: yes

- name: restart eosc-rs
  systemd:
    name: eosc-rs
    state: restarted
    daemon_reload: yes
  become: yes

- name: restart eosc-group-rs
  systemd:
    name: eosc-group-rs
    state: restarted
    daemon_reload: yes
  become: yes

- name: reload nginx
  systemd:
    name: nginx
    state: reloaded
  become: yes
