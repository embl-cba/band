---
# The static front end, served by nginx on port 80 from /var/www/html/portal,
# a link to band-portal-web (default) or to the old eosc-js, both installed
# (portal_frontend). TLS and the routing of /client, /guacamole and /kc are
# done by the reverse proxy.
- name: Create /var/www/html/eosc-js-<version>
  file:
    path: "/var/www/html/eosc-js-{{eosc_js_version}}"
    state: directory
    mode: '0755'
  become: yes

- name: download the old front end
  get_url:
    url: "{{ eosc_js_url }}"
    dest: "/var/www/html/eosc-js.{{ eosc_js_version }}.tar.gz"
    checksum: "sha256:{{ eosc_js_sha256 }}"
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: unpack the front end
  unarchive:
    src: "/var/www/html/eosc-js.{{ eosc_js_version }}.tar.gz"
    dest: "/var/www/html/eosc-js-{{eosc_js_version}}"
    remote_src: yes
    extra_opts: [--strip-components=1, --no-same-owner]
    creates: "/var/www/html/eosc-js-{{eosc_js_version}}/index.html"
  become: yes

- name: drop editor backups shipped in the tarball
  file:
    path: "/var/www/html/eosc-js-{{eosc_js_version}}/eosc-landingpage/eosc-landingpage.html~"
    state: absent
  become: yes

# app.js has the portal's public name for the API base URLs
- name: point the front end at this portal
  replace:
    path: "/var/www/html/eosc-js-{{eosc_js_version}}/app.js"
    regexp: "https://[^/']+/(kc|grouprs)/"
    replace: "https://{{ eosc_portal_hostname }}/\\1/"
  become: yes

- name: symlink /var/www/html/eosc-js to the current version
  file:
    src: "/var/www/html/eosc-js-{{eosc_js_version}}"
    dest: /var/www/html/eosc-js
    owner: root
    group: root
    state: link
    force: yes
  become: yes

######## band-portal-web: a release of embl-cba/band-portal-web (built files)
- name: band-portal-web {{ band_portal_web_version }} release
  get_url:
    url: "{{ band_portal_web_url }}"
    dest: "/var/www/html/band-portal-web-{{ band_portal_web_version }}.tar.gz"
    checksum: "sha256:{{ band_portal_web_sha256 }}"
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: /var/www/html/band-portal-web-<version>
  file:
    path: "/var/www/html/band-portal-web-{{ band_portal_web_version }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: unpack band-portal-web
  unarchive:
    src: "/var/www/html/band-portal-web-{{ band_portal_web_version }}.tar.gz"
    dest: "/var/www/html/band-portal-web-{{ band_portal_web_version }}"
    remote_src: yes
    extra_opts: [--no-same-owner]
    creates: "/var/www/html/band-portal-web-{{ band_portal_web_version }}/index.html"
  become: yes

# the release tarball keeps its builder's modes
- name: band-portal-web files read-only
  file:
    path: "/var/www/html/band-portal-web-{{ band_portal_web_version }}"
    owner: root
    group: root
    mode: u=rwX,g=rX,o=rX
    recurse: yes
  become: yes

######## the one nginx serves
- name: /var/www/html/portal -> {{ portal_frontend }}
  file:
    src: "{{ '/var/www/html/band-portal-web-' ~ band_portal_web_version if portal_frontend == 'band-portal-web'
             else '/var/www/html/eosc-js-' ~ eosc_js_version }}"
    dest: /var/www/html/portal
    owner: root
    group: root
    state: link
    force: yes
  become: yes

- name: nginx site for the front end
  template:
    src: nginx-portal.conf.j2
    dest: /etc/nginx/sites-available/band-portal
    owner: root
    mode: '0644'
  become: yes
  notify: reload nginx

- name: enable the site
  file:
    src: /etc/nginx/sites-available/band-portal
    dest: /etc/nginx/sites-enabled/band-portal
    state: link
  become: yes
  notify: reload nginx

- name: disable nginx's default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: yes
  notify: reload nginx

- name: nginx running
  systemd:
    name: nginx
    state: started
    enabled: yes
  become: yes
