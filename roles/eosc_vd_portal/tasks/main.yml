## YAML Template.
## Ubuntu only; vars/<distribution>_<version>_<arch>.yml must exist (24.04 for tubi)
---
- include_vars: "main.yml"
  tags: always
- include_vars: "{{ ansible_distribution }}_{{ ansible_distribution_version }}_{{ ansible_architecture }}.yml"
  tags: always
- import_tasks: artifacts.yml
  tags: always
- import_tasks: base.yml
  tags: portal_base



- import_tasks: tomcat.yml
  tags: portal_tomcat
- import_tasks: guacd.yml
  tags: portal_guacd

- import_tasks: eosc.yml
  tags: portal_eosc

- import_tasks: web.yml
  tags: portal_web
