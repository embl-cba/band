### tomcat
# Tomcat 9 (javax.servlet; client.war does not run on 10). archive.apache.org
# keeps every release; sha512 from Apache, signature checked with Tomcat's KEYS
apache_tomcat_version: 9.0.123
apache_tomcat_url: "https://archive.apache.org/dist/tomcat/tomcat-9/v{{apache_tomcat_version}}/bin/apache-tomcat-{{apache_tomcat_version}}.tar.gz"
apache_tomcat_sha512: 64b1130e719399c0a409e6996081433b16af8d9c89266c7aaa9849af70a1815feca91e13896f5ccc41451dc5759716d1c84882682de955822c30509de102f290
  

### portal client: the build running on the tubi portal since 2024-11, with
### its bundled log4j 2.5 (Log4Shell) replaced by 2.24.3 (Apache-signed jars)
portal_client_version: 0.0.1
portal_client_file: "client-{{ portal_client_version }}-log4j-2.24.3.war"
portal_client_url: "{{ portal_artifacts_url }}/{{ portal_client_file }}"
portal_client_sha256: bb985e18a29d221df5c6889a81f73a1ba74df24772698748dc1a9f8e5d30afaf

### resource server
# 0.0.4 rebuilt with files/patches/resource-server-sha512.patch (SHA-512 certs)
resource_server_version: 0.0.4-sha512
resource_server_url: "{{ portal_artifacts_url }}/resource-server-{{ resource_server_version }}.jar"
resource_server_sha256: ae70ee0f6c37f70ff2334cd93fbaf25f534e229961e3b81e1cfda60bd4d4e9f8

### eosc portal
# eosc-js.<version>.tar.gz: the web front end as running on the tubi
# portal on 2026-10-30 (with its local edits); unpacks to eosc-js/
eosc_js_version: tubi.20261030
eosc_js_url: "{{ portal_artifacts_url }}/eosc-js.{{ eosc_js_version }}.tar.gz"
eosc_js_sha256: 6079509cc630b15ff1ae9f2ef0f307b0b739b3474ee58eaf6de839e5eb9ee747

# the front end nginx serves: band-portal-web (Vue, embl-cba/band-portal-web)
# or eosc-js (the old AngularJS one, kept installed to switch back)
portal_frontend: band-portal-web
band_portal_web_version: "1.0.1"
band_portal_web_url: "https://github.com/embl-cba/band-portal-web/releases/download/v{{ band_portal_web_version }}/band-portal-web-{{ band_portal_web_version }}.tar.gz"
band_portal_web_sha256: 7f36621f4501de040486533e590251d9ba6105b72cab9586011b66ceb078b593

### guacamole: the official Apache release, from archive.apache.org (sha256 as
### published there); guacd must be the same version
guacamole_version: 1.6.0
guacamole_war_url: "https://archive.apache.org/dist/guacamole/{{ guacamole_version }}/binary/guacamole-{{ guacamole_version }}.war"
guacamole_war_sha256: b41ceb1e2df010b54db563e0b00edb8d5fe9f073c6168462e4c978df0fc6e716

### eosc.json: Slurm commands on the login node; /opt/slurm is a symlink to the
### installed version (slurm-common), so a Slurm upgrade needs no portal change
portal_slurm_bin: /opt/slurm/bin
### desktop sizes offered by the portal (nodes: 8 CPUs, 82 GB, 1 GPU each)
portal_desktop:
  ppn:   {default: 2,   min: 1, max: 8}
  mem:   {default: 4,   min: 1, max: 80}     # GB
  gpu:   {default: 0,   min: 0, max: 1}
  hours: {default: 120, min: 1, max: 336}

### MongoDB for client.war (docker, see tasks/base.yml)
portal_mongodb_version: "3.6"
portal_mongodb_data: /var/lib/mongodb-docker

### guacamole home
guacamole_home: /etc/guacamole

### BAND Guacamole extension (turns the portal's cookie into the connection),
### built for guacamole_version; a release asset of its own repository
band_guac_ext_version: 1.6.1
band_guac_ext_jar: "band-guacamole-extension-{{ band_guac_ext_version }}.jar"
band_guac_ext_url: "https://github.com/embl-cba/band-guacamole-extension/releases/download/v{{ band_guac_ext_version }}/{{ band_guac_ext_jar }}"
band_guac_ext_sha256: 4bccd2185851183f7bddb846cef50c2a47d49d56631f1c7a157cac94f6b3efd6
# Guacamole may only SSH/SFTP to these: the desktop nodes' addresses, as the
# portal's execHost gives them (getent hosts on the login node)
band_ssh_hosts: "{{ groups['DesktopNodes'] | map('extract', hostvars, 'ansible_ssh_host') | list }}"
## gson for the extension (not in guacamole.war)
gson_version: 2.14.0
gson_url: "https://repo1.maven.org/maven2/com/google/code/gson/gson/{{ gson_version }}/gson-{{ gson_version }}.jar"
gson_sha256: 2cbd119bf1961c28788310963dc80ba65f58cdeec1dd139c8bdb1240faa2c36f
# what earlier versions installed
guacamole_lib_removed:
  - "{{ guacamole_home }}/lib/gson-2.4.jar"
  - "{{ guacamole_home }}/extensions/massive-guacamole-remote-1.6.0.jar"

### tomcat dir
tomcat_dir: /opt/apache-tomcat
###  dir
cache_location: "{{eosc_dir}}/tmpfs/eosc.cache"

###certificates
certs_dir: /etc/certs

### tempfs
temp_dir: "{{eosc_dir}}/tmpfs"

