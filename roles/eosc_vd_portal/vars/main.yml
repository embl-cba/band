login_host: "{{ hostvars[groups['LoginNodes'][0]]['ansible_ssh_host'] }}"
resource_server_port: 9001
guad_port: 4822

### what we built ourselves (client.war, resource server) and the old front
### end are assets of a GitHub release of this repository; each task downloads
### its file straight to the portal, checked against the sha256 above
portal_artifacts_url: "https://github.com/embl-cba/band/releases/download/portal-artifacts-tubi-20261030"
