---
# EGL back end: VirtualGL talks to the GPU directly, no GDM/Xorg on the nodes.
- name: Add the official VirtualGL repository
  yum_repository:
    name: VirtualGL
    description: VirtualGL official RPMs
    baseurl: https://packagecloud.io/dcommander/virtualgl/rpm_any/rpm_any/$basearch
    gpgcheck: yes
    repo_gpgcheck: yes
    gpgkey:
      - https://packagecloud.io/dcommander/virtualgl/gpgkey
      - https://raw.githubusercontent.com/VirtualGL/repo/main/VGL-GPG-KEY
  register: vgl_repo

# in --check a new repository isn't really there yet
- name: Install VirtualGL
  dnf:
    name: VirtualGL-{{ vgl_version }}
    state: present
  when: not (ansible_check_mode and vgl_repo is changed)

# what vglserver_config +egl +s +f sets up: every user may open the GPUs' DRI
# devices. vglserver_config itself unloads and reloads the nvidia modules,
# which fails on a node in use (nvidia-drm: "Failed to allocate
# NvKmsKapiDevice" leaves the GPUs without /dev/dri devices until a reboot),
# so write its udev rule here and apply it without touching the driver.
# Jobs still only reach their own GPUs (Slurm's ConstrainDevices).
- name: DRI devices open to all users
  copy:
    dest: /etc/udev/rules.d/99-virtualgl-dri.rules
    content: |
      # managed by ansible (BAND)
      SUBSYSTEM=="drm", KERNEL=="card*|renderD*", MODE="0666"
    owner: root
    group: root
    mode: '0644'
  register: vgl_udev

- name: apply the udev rule
  command: udevadm trigger --subsystem-match=drm --action=change
  when: vgl_udev is changed

# the nodes also have a virtio_gpu card (card0); VGL_DISPLAY picks the job's
# NVIDIA GPU (vgl-display)
- name: vgl-display
  template:
    src: vgl-display.j2
    dest: /usr/local/bin/vgl-display
    mode: '0755'

- name: Set VGL_DISPLAY for all users
  template:
    src: "{{ item }}.j2"
    dest: /etc/profile.d/{{ item }}
    mode: '0644'
  loop:
    - virtualgl.sh
    - virtualgl.csh

# nvidia-drm gives each GPU a /dev/dri/cardN; without it EGL can't render
- name: NVIDIA DRI devices
  shell: |
    rc=0
    for d in /proc/driver/nvidia/gpus/*; do
      c=/dev/dri/by-path/pci-$(basename $d)-card
      if [ -e $c ]; then readlink -f $c
      else echo "no DRI device for GPU $(basename $d) (nvidia-drm failed to load?): reboot this node" >&2; rc=1; fi
    done
    exit $rc
  register: vgl_cards
  changed_when: false
  check_mode: false
  failed_when: vgl_cards.rc != 0 or vgl_cards.stdout_lines | length == 0

# as a normal user on every GPU, so it also proves the device permissions work
# for everyone
- name: Check VirtualGL can render on each GPU
  command: /opt/VirtualGL/bin/eglinfo {{ item }} -B
  become_user: "{{ ansible_ssh_user }}"
  loop: "{{ vgl_cards.stdout_lines }}"
  register: vgl_eglinfo
  changed_when: false
  check_mode: false
  failed_when: vgl_eglinfo.rc != 0 or 'NVIDIA' not in vgl_eglinfo.stdout

- debug:
    msg: "{{ vgl_eglinfo.results | map(attribute='stdout_lines') | flatten | select('search', 'renderer string') | list }}"
