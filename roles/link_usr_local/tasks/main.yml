---
- name: stat
  stat: path={{ dest }}
  register: stat_r

# a real directory is moved aside and replaced by the link; an existing link is left alone
- name: mv
  command: mv {{ dest }} {{ dest }}_old
  when: stat_r.stat.exists and stat_r.stat.isdir
  become: yes

- name: link
  file: src={{ source }} dest={{ dest }} state=link
  when: not stat_r.stat.exists or stat_r.stat.isdir
  become: yes
