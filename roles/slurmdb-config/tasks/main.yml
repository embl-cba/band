---
- name: install deps in control node
  yum: name={{ item }} state=installed
  become: yes
  with_items:
    #- mysql
    #- mysql-devel
    - mariadb-connector-c
    - mariadb-connector-c-devel
    - python3-PyMySQL
  when: ansible_distribution == 'Rocky'

- name: install deps in control node
  apt: name={{ item }} state=installed
  become: yes
  with_items:
    - mysql-client
    - libmysqlclient-dev
    - python-mysqldb
  when: ansible_distribution == 'Ubuntu'

- name: make sure config dir exists
  file: path="{{ slurm_dir }}/etc" state=directory
  become: yes

# must belong to SlurmUser: slurmdbd re-reads it as slurm on SIGHUP (the
# daily logrotate reload), and dies if it can't
- name: install slurmdb.conf
  copy: src=files/slurmdbd.conf dest={{ slurm_dir }}/etc/slurmdbd.conf owner=slurm group=slurm mode=600
  become: yes
  when: slurm_dir is defined


- name: install slurmdbd.conf
  copy: src=slurmdbd.conf dest=/etc/slurm/slurmdbd.conf mode=600
  become: yes
  when: slurm_dir is not defined

- name: add slurm db log rotate config
  template: src=slurmdblog.j2 dest=/etc/logrotate.d/slurmdb mode=644
  become: yes

