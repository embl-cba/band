---
# slurmdbd.conf belongs to SlurmUser; on a fresh host slurm-common (which
# also creates it) hasn't run yet. Same ids as there.
- name: create slurm group
  group: name=slurm system=yes gid=497
  become: yes

- name: create slurm user
  user: name=slurm group=slurm system=yes createhome=no uid=497
  become: yes

- name: install deps in control node
  yum: name={{ item }} state=installed
  become: yes
  with_items:
    #- mysql
    #- mysql-devel
    - mariadb-connector-c
    - mariadb-connector-c-devel
    - python3-PyMySQL
  when: ansible_distribution == 'Rocky'

- name: install deps in control node
  apt: name={{ item }} state=installed
  become: yes
  with_items:
    - mysql-client
    - libmysqlclient-dev
    - python-mysqldb
  when: ansible_distribution == 'Ubuntu'

- name: make sure config dir exists
  file: path="{{ slurm_dir }}/etc" state=directory
  become: yes

# must belong to SlurmUser: slurmdbd re-reads it as slurm on SIGHUP (the
# daily logrotate reload), and dies if it can't
- name: install slurmdb.conf
  copy: src=files/slurmdbd.conf dest={{ slurm_dir }}/etc/slurmdbd.conf owner=slurm group=slurm mode=600
  become: yes
  when: slurm_dir is defined


- name: install slurmdbd.conf
  copy: src=slurmdbd.conf dest=/etc/slurm/slurmdbd.conf mode=600
  become: yes
  when: slurm_dir is not defined

- name: add slurm db log rotate config
  template: src=slurmdblog.j2 dest=/etc/logrotate.d/slurmdb mode=644
  become: yes


# job history of a previous instance (site.yml: slurmdbd_restore_dump, a
# gzipped mysqldump of slurm_acct_db on the ansible host). Only into an empty
# database, so a rerun never overwrites live accounting; this role runs
# before slurmdbd's first start (slurm-start), which then upgrades the tables.
- name: restore the accounting database
  when: slurmdbd_restore_dump | default('') | length > 0
  become: yes
  block:
  - name: tables in {{ slurmdbd_db_name }}
    community.mysql.mysql_query:
      login_user: root
      login_password: "{{ sqlrootPasswd }}"
      login_unix_socket: /var/lib/mysql/mysql.sock
      query: "SELECT COUNT(*) AS n FROM information_schema.tables WHERE table_schema = %s"
      positional_args: ["{{ slurmdbd_db_name }}"]
    register: acct_tables
    check_mode: false
    # in --check on a fresh host there is no MariaDB yet
    ignore_errors: "{{ ansible_check_mode }}"

  - name: "{{ slurmdbd_db_name }} isn't empty: not restoring"
    debug:
      msg: "{{ acct_tables.query_result[0][0].n }} tables already there, {{ slurmdbd_restore_dump }} not loaded"
    when: acct_tables.query_result is defined and acct_tables.query_result[0][0].n | int > 0

  - name: load {{ slurmdbd_restore_dump | basename }}
    when: acct_tables.query_result is defined and acct_tables.query_result[0][0].n | int == 0
    block:
    - name: copy the dump
      copy:
        src: "{{ slurmdbd_restore_dump }}"
        dest: /root/slurm_acct_db-restore.sql.gz
        owner: root
        group: root
        mode: '0600'

    - name: import it
      community.mysql.mysql_db:
        name: "{{ slurmdbd_db_name }}"
        state: import
        target: /root/slurm_acct_db-restore.sql.gz
        login_user: root
        login_password: "{{ sqlrootPasswd }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
    always:
    - name: remove the copy
      file:
        path: /root/slurm_acct_db-restore.sql.gz
        state: absent

######## weekly backup of the accounting database (local, and a copy on the share)
- name: "{{ slurmdb_backup_dir }}"
  file:
    path: "{{ slurmdb_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: yes
  tags: slurmdb_backup

# the slurmdb user may only reach the accounting database, and only over TCP
# from slurmdbd's host (mysql_user_host), as slurmdbd itself connects
- name: backup credentials
  copy:
    dest: /root/.slurmdb-backup.cnf
    content: |
      [client]
      host={{ slurmdb_backup_db_host }}
      user=slurmdb
      password={{ slurmdb_passwd }}
    owner: root
    group: root
    mode: '0600'
  no_log: true
  become: yes
  tags: slurmdb_backup

# /usr/local/sbin is a link into the NFS share on this cluster: keep the
# script local
- name: backup script
  template:
    src: slurmdb-backup.sh.j2
    dest: /usr/local/bin/slurmdb-backup
    owner: root
    group: root
    mode: '0700'
  become: yes
  tags: slurmdb_backup

- name: mail when the backup fails
  import_role:
    name: failure_mail
  when: failure_mail_to | default('') | length > 0
  tags: slurmdb_backup

- name: backup service and timer
  copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - name: slurmdb-backup.service
      content: |
        [Unit]
        Description=Slurm accounting database backup (mysqldump)
        Requires=mariadb.service
        After=mariadb.service
        {{ 'OnFailure=failure-mail@%n.service' if failure_mail_to | default('') else '' }}

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/slurmdb-backup
    - name: slurmdb-backup.timer
      content: |
        [Unit]
        Description=Slurm accounting database backup, weekly

        [Timer]
        OnCalendar={{ slurmdb_backup_time }}
        # catch up after the VM was off at that time
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  become: yes
  tags: slurmdb_backup

- name: backup timer enabled
  systemd:
    name: slurmdb-backup.timer
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
  tags: slurmdb_backup
