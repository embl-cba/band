---
# icons of the launchers that come as files (the rest are theme icons)
- name: Copy the launcher icons
  become: yes
  copy:
    src: "{{ item }}"
    dest: "/usr/share/pixmaps/{{ item }}"
    mode: '0644'
  loop: "{{ desktop_launchers | map(attribute='icon') | select('search', '\\.') | unique | list + ['rfi-logo.png'] }}"

- name: Launcher scripts
  become: yes
  template:
    src: "{{ item }}.j2"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ desktop_scripts }}"

- name: Launchers
  become: yes
  template:
    src: launcher.desktop.j2
    dest: "/usr/share/applications/{{ item.file }}.desktop"
    mode: '0644'
  loop: "{{ desktop_launchers }}"
  loop_control:
    label: "{{ item.file }}"

- name: Remove launchers no longer offered
  become: yes
  file:
    path: "/usr/share/applications/{{ item }}.desktop"
    state: absent
  loop: "{{ desktop_launchers_removed }}"
