- name: Copy all icons
  become: yes
  copy:
    src: "{{ item.icon }}"
    dest: "/usr/share/pixmaps/{{ item.icon }}"
    mode: '0644'
  loop: "{{ gnome_apps }}"

# helper scripts the napari and Fiji launchers call (rclone and rclone-gui: role rclone)
- name: Launcher scripts
  become: yes
  copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: [run_napari_vgl.sh, fiji-start.sh]

- name: Deploy .desktop files from templates
  become: yes
  template:
    src: "{{ item.desktop_base }}.desktop.j2"
    dest: "/usr/share/applications/{{ item.desktop_base }}.desktop"
    mode: '0644'
  loop: "{{ gnome_desktop_files }}"
  loop_control:
    label: "{{ item.desktop_base }}"

- name: Remove replaced .desktop files
  become: yes
  file:
    path: "/usr/share/applications/{{ item }}.desktop"
    state: absent
  loop: "{{ gnome_desktop_files_removed | default([]) }}"
