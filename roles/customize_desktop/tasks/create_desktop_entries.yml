- name: Copy all icons
  become: yes
  copy:
    src: "{{ item.icon }}"
    dest: "/usr/share/pixmaps/{{ item.icon }}"
    mode: '0644'
  loop: "{{ gnome_apps }}"

# helper script the napari launcher calls (rclone and rclone-gui: role rclone)
- name: Launcher scripts
  become: yes
  copy:
    src: run_napari_vgl.sh
    dest: /usr/local/bin/run_napari_vgl.sh
    owner: root
    group: root
    mode: '0755'

- name: Deploy .desktop files from templates
  become: yes
  template:
    src: "{{ item.desktop_base }}.desktop.j2"
    dest: "/usr/share/applications/{{ item.desktop_base }}.desktop"
    mode: '0644'
  loop: "{{ gnome_desktop_files }}"
  loop_control:
    label: "{{ item.desktop_base }}"
