---
- include_vars: "{{ ansible_distribution }}_{{ ansible_architecture }}.yml"

- include_vars: "Rocky_x86_64.yml"
  when: ansible_distribution == "Rocky" and ansible_distribution_major_version == "8"

- include_vars: "Rocky_9_x86_64.yml"
  when: ansible_distribution == "Rocky" and ansible_distribution_major_version == "9"

- name: add epel 
  yum:
    name: epel-release
    state: present
  become: yes
  when: ansible_distribution == "Rocky" and ansible_distribution_major_version | int >= 8
  ignore_errors: true

# must be in place before the GUI group: installing plymouth rebuilds every initramfs
- name: keep plymouth out of the initramfs
  copy: src=omit-plymouth.conf dest=/etc/dracut.conf.d/omit-plymouth.conf mode=0644
  become: yes
  when: ansible_facts['os_family'] == 'RedHat'

# dnf's group install also upgrades the group's installed packages (a new
# linux-firmware, ...), so only install groups that aren't installed yet;
# updates stay a deliberate step
- name: installed package groups
  command: dnf -q group list --installed "{{ item }}"
  become: yes
  register: group_installed
  changed_when: false
  check_mode: false
  with_items: "{{ system_group_packages }}"
  when: system_group_packages is defined

- name: yum group installs
  become: yes
  dnf:
    name: "@{{ item.item }}"
    state: present
  loop: "{{ group_installed.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: system_group_packages is defined and 'Installed' not in item.stdout

# the GUI group pulls in firewalld enabled; it blocks slurmd (6818) and srun
# ports after the next reboot. The cluster relies on the OpenStack security groups.
- name: keep firewalld off
  become: yes
  systemd:
    name: firewalld
    state: stopped
    enabled: no
  when: system_group_packages is defined

- name: install system packages yum
  yum: name={{ item }} state=present update_cache=yes
  become: yes
  with_items: "{{system_packages}}"
  when: ansible_distribution == "Rocky"

# package installs can rebuild the initramfs; if /boot filled up, a kernel is unbootable
- name: check every installed kernel has a readable initramfs
  shell: |
    rc=0
    for k in $(rpm -q kernel-core --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n'); do
      lsinitrd /boot/initramfs-$k.img >/dev/null 2>&1 || { echo "missing or broken: /boot/initramfs-$k.img"; rc=1; }
    done
    exit $rc
  become: yes
  changed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

# GNOME flashback/metacity default xstartup, default geometry 1440x900
- name: vncserver script
  template: src=vncserver.rocky dest=/bin/vncserver
  become: yes
  when: ansible_distribution == "Rocky"

