---
- name: current crypto policy
  command: update-crypto-policies --show
  register: crypto_policy_current
  changed_when: false
  check_mode: false

# services pick the new policy up when they restart; sshd is reloaded below
- name: crypto policy {{ crypto_policy }}
  command: update-crypto-policies --set {{ crypto_policy }}
  when: crypto_policy_current.stdout | trim != crypto_policy
  register: crypto_policy_set
  become: yes
