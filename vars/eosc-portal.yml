## YAML Template.
---
eosc_dir: /opt/eosc
eosc_ssh_ca_dir: "{{eosc_dir}}/certs"
ca_pass_prase: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          30373839626463376432326134306639646262393064393765396237353938356562353335313864
          3737313264643066613338386366343965626665383535340a656430656533386532656165363634
          66303339653430613066366366363737303230653866633936613766386664376132663737656566
          3565613037323638610a653963353030643463613035393036613530613437316437343266396236
          66613164396431313563656633386463346434343339396130326235653766316461613762613739
          3138353131616633346233323439303737336634633262646166
eosc_portal_hostname: "{{ site_portal_hostname }}"

# cesnet changes to the built web front end (roles/eosc_vd_portal tasks/web.yml)
portal_web_files:
  - {src: web-logos/cesnet-white.png, dest: images/logos/cesnet-white.png}
  - {src: web-logos/cesnet.png, dest: images/logos/cesnet.png}
portal_web_replacements:
  # logo strip at the top of every page (dark background: white text)
  - name: CESNET logo in the header
    regexp: 'alt:`NFDI4BIOIMAGE`\}\]'
    replace: 'alt:`NFDI4BIOIMAGE`},{href:`https://www.cesnet.cz/`,src:`images/logos/cesnet-white.png`,alt:`CESNET`}]'
  # acknowledgement page: a light tile after the EOSC-Life one
  - name: CESNET logo on the acknowledgement page
    regexp: '(alt="EOSC-Life"></a>)(?!\s*<a class="ack-logo ack-logo-light" href="https://www\.cesnet\.cz/")'
    replace: '\1\n\t\t<a class="ack-logo ack-logo-light" href="https://www.cesnet.cz/" target="_blank" rel="noopener"><img src="images/logos/cesnet.png" alt="CESNET"></a>'
  # Resources page: the cesnet cluster (5 nodes x 2 GPUs: 1x 2x RTX 2080, 4x 2x Tesla T4)
  - name: GPUs on the Resources page
    regexp: '\b8 GPUs for computation and graphics rendering'
    replace: '10 GPUs for computation and graphics rendering'
  - name: CPUs on the Resources page
    regexp: '\b64 CPUs\b'
    replace: '120 CPUs'
  - name: RAM on the Resources page
    regexp: '\b680GB RAM\b'
    replace: '300GB RAM'
  # the front end allows at most 40 GB per desktop
  - name: desktop RAM limit on the Resources page
    regexp: '&lt;=80G RAM'
    replace: '&lt;=40G RAM'
  # desktop sizes: the release's six plus common screens (4K, ultrawide,
  # 16:10, laptops at 100/125%); the default stays 1900x900
  - name: desktop resolutions
    regexp: 'resolutions:\[`2560x1440`,`1920x1200`,`1920x1080`,`1900x900`,`1280x778`,`1024x768`\]'
    replace: 'resolutions:[`3840x2160`,`3440x1440`,`2560x1600`,`2560x1440`,`2560x1080`,`1920x1200`,`1920x1080`,`1900x900`,`1680x1050`,`1600x900`,`1536x864`,`1440x900`,`1366x768`,`1280x800`,`1280x778`,`1024x768`]'
  # the size a desktop starts with, until the browser sends its window size
  - name: default desktop resolution
    regexp: 'resolution:`1900x900`\}'
    replace: 'resolution:`1600x900`}'
  # Resources page: batch jobs run on the same nodes as the desktops (the
  # release has the old instance's separate cluster, 192 CPUs, commented out)
  - name: batch jobs on the Resources page
    regexp: '(?s)<!--\s*<p>In addition to the above resources, the following resources can also be used for internal cluster jobs.*?-->'
    replace: '<p>From a terminal in a BAND desktop, batch jobs can also be submitted to the SLURM scheduler (sbatch). They run on the same nodes and share the resources above with the desktops, so please request only what a job needs.</p>'
  # Status page: the cesnet cluster has 5 nodes (the release lists 8).
  # Node 4 is out of service (a GPU lost from the PCI bus, 2026-11-16).
  - name: nodes on the Status page
    regexp: '(?s)<p><i class="bi bi-emoji-smile status-ok"></i>Node 1 is healthy\. </p>.*?Node 8 is healthy\. </p>'
    replace: '<p><i class="bi bi-emoji-smile status-ok"></i>Node 1 is healthy. </p>\n<p><i class="bi bi-emoji-smile status-ok"></i>Node 2 is healthy. </p>\n<p><i class="bi bi-emoji-smile status-ok"></i>Node 3 is healthy. </p>\n<p><i class="bi bi-tools status-ok" style="color:#f9b233"></i>Node 4 is under maintenance (out of service). </p>\n<p><i class="bi bi-emoji-smile status-ok"></i>Node 5 is healthy. </p>'
  # while the new instance is being finished; to undo, remove this entry and
  # reinstall the front end (delete /var/www/html/band-portal-web-<version>)
  - name: maintenance on the Status page
    regexp: '<p><i class="bi bi-emoji-smile status-ok"></i>There''s currently no system downtime planned\. </p>'
    replace: '<p><i class="bi bi-tools status-ok" style="color:#f9b233"></i>BAND is under maintenance until November 23, 2026. </p>'
  # acknowledgement page: CESNET's required acknowledgement as the second point
  - name: CESNET acknowledgement text
    regexp: '(501864659\. </p>\s*</li>)(?!\s*<li>\s*<p>Access to CESNET)'
    replace: '\1\n\t\t\t<li>\n\t\t\t\t<p>Access to CESNET storage facilities provided by the project “e-INFRA CZ” under the programme “Projects of Large Research, Development, and Innovations Infrastructures” (LM2023054), is greatly appreciated.</p>\n\t\t\t</li>'
