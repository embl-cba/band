---
desktopNodeList:
  - { name : 'DesktopNodes', interface : 'eth0' }
clustername: "mbp"
projectname: "band"
slurm_version: 25.11.4
munge_version: 0.5.13   # cesnet: what the cluster runs (built with OpenSSL 3)
nhc_version: 1.4.2
munge_dir: /opt/munge-{{ munge_version }}
slurm_dir: /opt/slurm-{{ slurm_version }}
nhc_dir: /opt/nhc-{{ nhc_version }}
nhc_config_file: nhc.conf
nhc_log_level: 0
nhc_emails: nobody@nowhere.nowhere
nhc_email_subject: "Node Health Check"
openmpi_version: 1.8.3
mysql_host: "{{ groups['ManagementNodes'][0] }}"
slurmctrl: "{{ groups['ManagementNodes'][0] }}"
#slurmctrlbackup: "{{ groups['ManagementNodes'][1] }}"
slurmdbd: "{{ groups['ManagementNodes'][0] }}"
#slurmdbdbackup: "{{ groups['ManagementNodes'][1] }}"
slurmlogin: "{{ groups['LoginNodes'][0] }}"
slurm_use_vpn: false
slurmqueues:
  - {name: batch, group: default_partition, default: yes}
  - {name: rocky, group: rocky_partition, default: no}
#  - {name: ubuntu, group: ubuntu_partition, default: no}
slurmlogin: "{{ groups['LoginNodes'][0] }}"
slurmlogdir: "{{ slurm_dir }}/var/log"
slurmctlddebug: {level: info, log: '/var/log/slurmctld.log'}
slurmddebug: {level: info, log: '/var/log/slurmd.log'}
slurmschedlog: {level: 0, log: '/var/log/slurmsched.log'}
slurmdbdlog: {level: info, log: '{{ slurm_dir }}/var/log/slurmdbd.log'}
slurmfairshare: {def: false, val: 10000}
slurmdatadir: "{{ slurm_dir }}/var/spool"
slurmstatedir: "{{ slurm_dir }}/var/state"
#slurmstatedir: "/glusterVolume/slurmstate"
# unused while usesharedstatedir=False; slurmstate1 holds an old cluster's state
slurmsharedstatedir: "/nfs/slurmstate1"
slurmpiddir: "{{ slurm_dir }}/var/run"
slurmaccount_create_user: "/usr/local/sbin/slurmuseraccount.sh"
slurm_provision: "/cinderVolume/local/sbin/slurm_provision.sh"
slurmselecttype: "select/cons_tres"
slurmfastschedule: "1"
slurmschedulertype: "sched/backfill"
restartServerList:
  - slurm

# cesnet: two GPUs on every node (node-1 RTX 2080, node-2..5 Tesla T4); gres.conf
slurm_gres_list:
  - {name: "gpu", file: "/dev/nvidia0"}
  - {name: "gpu", file: "/dev/nvidia1"}

# cesnet: slurmdbd.conf has StorageHost=mgmt-0, so MariaDB knows the user only
# as slurmdb@mgmt-0.vm.fedcloud.eu (no @localhost, no @<fqdn>)
slurmdb_mysql_user_host: mgmt-0.vm.fedcloud.eu
slurmdb_mysql_user_hosts_group: []
# cesnet: MariaDB runs with its defaults, no job mail (no MailProg in slurm.conf)
mysql_innodb_settings: false
slurm_job_mail: false
