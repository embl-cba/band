ldapUserBase: "ou=users,dc=eosc-life,dc=eu"
ldapGroupBase: "ou=groups,dc=eosc-life,dc=eu"
ldapRfc2307Pam: |
  nss_base_passwd ou=users,dc=eosc-life,dc=eu?one
  nss_base_shadow ou=users,dc=eosc-life,dc=eu?one
  nss_base_group ou=groups,dc=eosc-life,dc=eu?one
