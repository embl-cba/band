---
# the LDAP server has no DNS record; its /etc/hosts line comes from files/etcHosts.
# Set ldapServerHostIpLine: "<ip> <ldap host> <short name>" to have
# ldapclient add it instead.

# CA of the LDAP server's certificate: ldapserver.yml fetches it to
# files/ldap-ca-<ldap host>.crt (not in git); clients verify the server with it
ldapCaCertSrc: "{{ playbook_dir }}/files/ldap-ca-{{ site_ldap_host }}.crt"

ldapCaCertFile: /etc/openldap/certs/ca.crt
ldapDomain: eosc-life.eu
ldapURI: "ldaps://{{ site_ldap_host }}"
ldapBindDN: "cn=nssproxy,ou=users,dc=eosc-life,dc=eu"
ldapBindDNPassword: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          37343364373431333336313966626335663038303338333637333937393934663963613964633364
          6463326539356464396434333233396463623430306264640a663638306333646138663362343234
          39346236316239313533386237326466626362626161363464313230613362636134343463636265
          6337363961613939380a343239356434383639626533643263616138633064666362623234633764
          6633
ldapBase: "dc=eosc-life,dc=eu"
ldapUserBase: "ou=users,dc=eosc-life,dc=eu"
ldapGroupBase: "ou=groups,dc=eosc-life,dc=eu"
ldapRfc2307Pam: |
  nss_base_passwd ou=users,dc=eosc-life,dc=eu?one
  nss_base_shadow ou=users,dc=eosc-life,dc=eu?one
  nss_base_group ou=groups,dc=eosc-life,dc=eu?one
  pam_filter objectclass=account
  pam_login_attribute uid
  pam_login_attribute userPrincipalName
  pam_template_login_attribute uid
  pam_template_login nobody
ldapRfc2307: |
  ldap_search_base = dc=eosc-life,dc=eu
  ldap_user_search_base = ou=users,dc=eosc-life,dc=eu
  ldap_group_search_base = ou=groups,dc=eosc-life,dc=eu
ldap_access_filter: "(objectClass=posixAccount)"

# must match ldapManagerPassword in attic/roles/eosc_ldapserver/vars/main.yml (the old LDAP server role)
ldapManagerPassword: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          64646538666265386635373233376639323962623465343037333463373636333666396438633062
          6633333735313630353435316466386435366365363064340a633264353038336131323162356565
          38646335623464383034633163656532306637326663623337366236656137623262383634343532
          6332326336636365330a306566383032326430616136643861623565353861613363373430396166
          3063
