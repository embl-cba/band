  ldap_search_base = dc=eosc-life,dc=eu
  ldap_user_search_base = ou=users,dc=eosc-life,dc=eu
  ldap_group_search_base = ou=groups,dc=eosc-life,dc=eu
ldap_access_filter: "(objectClass=posixAccount)"

