## YAML Template.
---
# The OS of ansible control machine has only been
# tested for CentOS. Change this to other value may break the code.
ansible_os_family: Rocky

# Java versions used.
java_major: 17
java_minor: 0.8
#java_build: 15
#java_home: /usr/lib/jvm/java-8-oracle

install_dir: /mnt

log_home: /mnt/log

httpd_confd_path: /etc/httpd/conf.d
httpd_conf_path: /etc/httpd/conf


