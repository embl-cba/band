# Desktop apps on the desktop nodes: apptainer (runs the containers in
# /vd-containers), java and standard tools, the GNOME desktop settings (dconf:
# screensaver, logout, background) and the application menu and launchers.

- hosts: 'DesktopNodes'
  become: yes
  roles:
    - { role: common }
    # rclone on the share (installed if missing), rclone-gui
    - { role: rclone }
    - { role: customize_desktop }
