# Desktop apps on the desktop nodes: apptainer (runs the containers in
# /vd-containers), java and standard tools, rclone and nextflow, the GNOME
# desktop settings (dconf: screensaver, logout, background) and the
# application menu and launchers.

- hosts: 'DesktopNodes'
  become: yes
  roles:
    - { role: common }
    # rclone and nextflow: binaries on the share (/nfs/local/bin), installed
    # if missing, linked into /usr/local/bin
    - { role: rclone }
    - { role: nextflow }
    - { role: customize_desktop }
