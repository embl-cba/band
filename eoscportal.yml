- hosts: '*'
  tasks:
  - include_vars: vars/eosc-portal.yml
  - include_vars: vars/ldapConfig.yml

#### system tools

- hosts: 'PortalNodes'
  tasks:
  - name: Create /opt/eosc if not exists
    become: yes
    file:
      path: "{{eosc_dir}}"
      state: directory
      mode: '0755'
      
  - name: Create eosc_ssh_ca_dir if not exists
    become: yes
    file:
      path: "{{eosc_ssh_ca_dir}}"
      state: directory
      mode: '0755'

