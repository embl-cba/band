  - name: copy /root/server_ca.pub and /root/server_ca to portal nodes
    copy:
      src: "{{item.src}}"
      dest: "{{item.dest}}"
      mode: "{{item.mode}}"
    become: yes
    with_items:
      - { src: "files/server_ca", dest: "{{eosc_ssh_ca_dir}}/server_ca", mode: '0600'}
      - { src: "files/server_ca.pub",dest: "{{eosc_ssh_ca_dir}}/server_ca.pub", mode: '0644'}
  
      

- hosts: 'LoginNodes:DesktopNodes'
  roles:
  - { role: jasons_ssh_ca }


- hosts: 'PortalNodes'
  user: ubuntu
  become: yes
  gather_facts: yes
  roles:
  - { role: eosc_vd_portal }
  
