- hosts: '*'
  tasks:
  - include_vars: vars/eosc-portal.yml
    tags: always
  - include_vars: vars/ldapConfig.yml
    tags: always

# /opt/eosc and the CA are set up by the eosc_vd_portal role (tasks/eosc.yml)

- hosts: 'LoginNodes:DesktopNodes'
  roles:
  - { role: jasons_ssh_ca }


- hosts: 'PortalNodes'
  user: ubuntu
  become: yes
  gather_facts: yes
  roles:
  - { role: eosc_vd_portal }
  
