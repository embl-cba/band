#
# Example slurm.conf file. Please run configurator.html
# (in doc/html) to build a configuration file customized
# for your environment.
#
#
# slurm.conf file generated by configurator.html.
#
# See the slurm.conf man page for more information.
#
ClusterName=mbp
ControlMachine=mgmt-0
#ControlAddr=
#BackupController=
#BackupAddr=
#
SlurmUser=slurm
SlurmdUser=root
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
#JobCredentialPrivateKey=
#JobCredentialPublicCertificate=
StateSaveLocation=/opt/slurm-25.11.4/var/state
SlurmdSpoolDir=/opt/slurm-25.11.4/var/spool
SwitchType=switch/none
MpiDefault=pmi2
SlurmctldPidFile=/opt/slurm-25.11.4/var/run/slurmctld.pid
SlurmdPidFile=/opt/slurm-25.11.4/var/run/slurmd.pid
#ProctrackType=proctrack/linuxproc
ProctrackType=proctrack/cgroup
#PluginDir=
#CacheGroups=0
#FirstJobId=
ReturnToService=1
#MaxJobCount=
#PlugStackConfig=
#PropagatePrioProcess=
#PropagateResourceLimits=
#PropagateResourceLimitsExcept=
#Prolog=
#Epilog=
#SrunProlog=
#SrunEpilog=
#TaskProlog=
#TaskEpilog=
TaskPlugin=task/cgroup
#TaskPlugin=task/affinity
#TaskPlugin=task/affinity,task/cgroup
OverTimeLimit=1
CompleteWait=10

#TrackWCKey=no
#TreeWidth=50
#TmpFS=
#UsePAM=
#
# TIMERS
#SlurmctldTimeout=300
#SlurmdTimeout=300
#InactiveLimit=0
#MinJobAge=300
KillWait=10
#Waittime=0
#
# SCHEDULING
SchedulerType=sched/backfill
#SchedulerAuth=
#SchedulerPort=
#SchedulerRootFilter=
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
#FastSchedule=1
PriorityType=priority/multifactor
#PriorityFlags=Ticket_Based
#PriorityCalcPeriod=5
#PriorityDecayHalfLife=0
#PriorityUsageResetPeriod=14-0
PriorityWeightFairshare=10000
PriorityWeightAge=10000
PriorityWeightPartition=10000
PriorityWeightJobSize=10000
PriorityMaxAge=14-0
#
# LOGGING
SlurmctldDebug=9
SlurmctldLogFile=/var/log/slurmctld.log
SlurmdDebug=9
SlurmdLogFile=/var/log/slurmd.log
SlurmSchedlogLevel=9
SlurmSchedLogFile=/var/log/slurmsched.log
JobCompType=jobcomp/none
#JobCompLoc=
#
Prolog=/opt/slurm-25.11.4/bin/slurm.prolog
Epilog=/opt/slurm-25.11.4/bin/slurm.epilog
#
# ACCOUNTING
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30
#
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=mgmt-0
AccountingStorageEnforce=limits,safe
AccountingStorageTRES=gres/gpu
DebugFlags=CPU_Bind,gres
#AccountingStorageLoc=
#AccountingStoragePass=
#AccountingStorageUser=
#
#GRES
GresTypes=gpu

# Fair share

DisableRootJobs=YES
MpiParams=ports=12000-12999
# COMPUTE NODES
NodeName=node-1 Gres=gpu:2 Procs=24 RealMemory=57344 Sockets=1 CoresPerSocket=24 ThreadsPerCore=1  Weight=1 Feature=gpu State=UNKNOWN  
NodeName=node-2 Gres=gpu:2 Procs=24 RealMemory=57344 Sockets=1 CoresPerSocket=24 ThreadsPerCore=1  Weight=1 Feature=gpu State=UNKNOWN 
NodeName=node-3 Gres=gpu:2 Procs=24 RealMemory=57344 Sockets=1 CoresPerSocket=24 ThreadsPerCore=1  Weight=1 Feature=gpu State=UNKNOWN 
NodeName=node-4 Gres=gpu:2 Procs=24 RealMemory=57344 Sockets=1 CoresPerSocket=24 ThreadsPerCore=1  Weight=1 Feature=gpu State=UNKNOWN 
NodeName=node-5 Gres=gpu:2 Procs=24 RealMemory=57344 Sockets=1 CoresPerSocket=24 ThreadsPerCore=1  Weight=1 Feature=gpu State=UNKNOWN 

NodeName=login-0 State=DOWN
NodeName=mgmt-0 State=DOWN

PreemptMode=GANG
 
PartitionName=batch Default=yes Nodes=node-1,node-2,node-3,node-4,node-5 DefaultTime=24:00:00 State=UP 
 
PartitionName=rocky Nodes=node-1,node-2,node-3,node-4,node-5 DefaultTime=24:00:00 State=UP 
