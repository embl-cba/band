#
# Example slurm.conf file. Please run configurator.html
# (in doc/html) to build a configuration file customized
# for your environment.
#
#
# slurm.conf file generated by configurator.html.
#
# See the slurm.conf man page for more information.
#
ClusterName=mbp
SlurmctldHost=mgmt-0
#ControlAddr=
#BackupController=
#BackupAddr=
#
SlurmUser=slurm
SlurmdUser=root
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge
#JobCredentialPrivateKey=
#JobCredentialPublicCertificate=
StateSaveLocation=/opt/slurm-25.11.4/var/state
SlurmdSpoolDir=/opt/slurm-25.11.4/var/spool
SwitchType=switch/none
MpiDefault=pmi2
SlurmctldPidFile=/opt/slurm-25.11.4/var/run/slurmctld.pid
SlurmdPidFile=/opt/slurm-25.11.4/var/run/slurmd.pid
#ProctrackType=proctrack/linuxproc
ProctrackType=proctrack/cgroup
#PluginDir=
#CacheGroups=0
#FirstJobId=
ReturnToService=1
#MaxJobCount=
#PlugStackConfig=
#PropagatePrioProcess=
#PropagateResourceLimits=
#PropagateResourceLimitsExcept=
#Prolog=
#Epilog=
#SrunProlog=
#SrunEpilog=
#TaskProlog=
#TaskEpilog=
TaskPlugin=task/cgroup
#TaskPlugin=task/affinity
#TaskPlugin=task/affinity,task/cgroup
OverTimeLimit=1
CompleteWait=10

#TrackWCKey=no
#TreeWidth=50
#TmpFS=
#UsePAM=
#
# TIMERS
#SlurmctldTimeout=300
#SlurmdTimeout=300
#InactiveLimit=0
#MinJobAge=300
KillWait=10
#Waittime=0
#
# SCHEDULING
SchedulerType=sched/backfill
#SchedulerAuth=
#SchedulerPort=
#SchedulerRootFilter=
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
# without this a job gets the whole node's memory (RealMemory/CPUs, rounded down)
DefMemPerCPU=10000
#FastSchedule=1
PriorityType=priority/multifactor
#PriorityFlags=Ticket_Based
#PriorityCalcPeriod=5
#PriorityDecayHalfLife=0
#PriorityUsageResetPeriod=14-0
PriorityWeightFairshare=10000
PriorityWeightAge=10000
PriorityWeightPartition=10000
PriorityWeightJobSize=10000
PriorityMaxAge=14-0
#
# LOGGING
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurmd.log
SlurmSchedlogLevel=0
SlurmSchedLogFile=/var/log/slurmsched.log
JobCompType=jobcomp/none
# s-nail, configured on the controller to send through the SMTP relay
MailProg=/usr/bin/mail
#JobCompLoc=
#
Prolog=/opt/slurm-25.11.4/bin/slurm.prolog
Epilog=/opt/slurm-25.11.4/bin/slurm.epilog
#
# ACCOUNTING
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30
#
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=mgmt-0
AccountingStorageEnforce=limits,safe
AccountingStorageTRES=gres/gpu
#AccountingStorageLoc=
#AccountingStoragePass=
#AccountingStorageUser=
#
#GRES
GresTypes=gpu

# Fair share

DisableRootJobs=YES
MpiParams=ports=12000-12999
# COMPUTE NODES
# slurmd -C: CPUs=8 SocketsPerBoard=8 RealMemory=84955; ~3 GB left for the OS
NodeName=node-[1-8] Gres=gpu:1 CPUs=8 RealMemory=82000 Sockets=8 CoresPerSocket=1 ThreadsPerCore=1 Weight=3 Feature=stage1 State=UNKNOWN

#monarch specific to stop stupid warning messages

 
 
 
 
 
 
 
 
PartitionName=batch Default=yes Nodes=node-[1-8] DefaultTime=24:00:00 State=UP 
 
 
 
 
 
 
 
 
 
PartitionName=rocky  Nodes=node-[1-8] DefaultTime=24:00:00 State=UP 
