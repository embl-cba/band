- hosts: 'LoginNodes:DesktopNodes:PortalNodes'
  tasks:
  - include_vars: vars/eosc-portal.yml
    tags: always
  - include_vars: vars/ldapConfig.yml
    tags: always

# /opt/eosc and the CA are set up by the eosc_vd_portal role (tasks/eosc.yml)

- hosts: 'LoginNodes:DesktopNodes'
  roles:
  - { role: portal_ca_trust }

# the portal makes each desktop's VNC password on the login node
# (eosc.json startServer: vncpasswd -f > ~/.vnc/passwd); without vncpasswd
# the file stays empty and Xvnc refuses Guacamole ("No password configured")
- hosts: 'LoginNodes'
  become: yes
  tasks:
  - name: vncpasswd for the portal
    dnf:
      name: tigervnc-server-minimal
      state: present


- hosts: 'PortalNodes'
  user: ubuntu
  become: yes
  gather_facts: yes
  roles:
  - { role: eosc_vd_portal }
  
